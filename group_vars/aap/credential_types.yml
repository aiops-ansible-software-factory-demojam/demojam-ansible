---
# These templates are evaluated by Controller when a VM job starts, rather
# than by Ansible while configuring the credential types.
controller_credential_types:
  - name: Demo VM API
    kind: cloud
    state: present
    inputs:
      fields:
        - id: kube_api_host
          label: Kubernetes API URL
          type: string
        - id: kube_api_token
          label: Service account token
          type: string
          secret: true
        - id: kube_api_ca
          label: Kubernetes CA
          type: string
          multiline: true
        - id: ssh_public_key
          label: VM SSH public key
          type: string
      required:
        - kube_api_host
        - kube_api_token
        - kube_api_ca
        - ssh_public_key
    injectors:
      file:
        template: !unsafe "{{ kube_api_ca }}"
      env:
        K8S_AUTH_HOST: !unsafe "{{ kube_api_host }}"
        K8S_AUTH_API_KEY: !unsafe "{{ kube_api_token }}"
        K8S_AUTH_SSL_CA_CERT: !unsafe "{{ tower.filename }}"
        K8S_AUTH_VERIFY_SSL: "true"
        VM_SSH_PUBLIC_KEY: !unsafe "{{ ssh_public_key }}"
  - name: Demo RHEL entitlement
    kind: cloud
    state: present
    inputs:
      fields:
        - id: entitlement_pem
          label: RHEL entitlement PEM
          type: string
          secret: true
          multiline: true
      required:
        - entitlement_pem
    injectors:
      file:
        template: !unsafe "{{ entitlement_pem }}"
      env:
        RHEL_ENTITLEMENT_FILE: !unsafe "{{ tower.filename }}"
  - name: Demo Forgejo issues
    kind: cloud
    state: present
    inputs:
      fields:
        - id: token
          label: Forgejo issue writer token
          type: string
          secret: true
      required:
        - token
    injectors:
      env:
        FORGEJO_API_TOKEN: !unsafe "{{ token }}"
