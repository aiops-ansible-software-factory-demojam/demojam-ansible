---
# Secret lookups belong to inventory. Bootstrap supplies the persistent source
# material in the dispatch credential; config-as-code owns the AAP objects.
demo_vm_credentials:
  api_host: "{{ lookup('ansible.builtin.env', 'DEMO_VM_API_HOST') }}"
  api_token_lookup: "{{ lookup('ansible.builtin.env', 'DEMO_VM_API_TOKEN') }}"
  api_ca: "{{ lookup('ansible.builtin.env', 'DEMO_VM_API_CA') }}"
  ssh_private_lookup: "{{ lookup('ansible.builtin.env', 'DEMO_VM_SSH_PRIVATE') }}"
  ssh_public: "{{ lookup('ansible.builtin.env', 'DEMO_VM_SSH_PUBLIC') }}"
  entitlement_lookup: >-
    {{ lookup('ansible.builtin.file',
              lookup('ansible.builtin.env', 'DEMO_RHEL_ENTITLEMENT_FILE'), rstrip=false) }}
demo_forgejo_credentials:
  token_lookup: "{{ lookup('ansible.builtin.env', 'DEMO_FORGEJO_TOKEN') }}"
demo_automation_orchestrator_credentials:
  client_id_lookup: "{{ lookup('ansible.builtin.env', 'DEMO_AUTOMATION_ORCHESTRATOR_CLIENT_ID') }}"
  client_secret_lookup: "{{ lookup('ansible.builtin.env', 'DEMO_AUTOMATION_ORCHESTRATOR_CLIENT_SECRET') }}"
demo_backend: "{{ lookup('ansible.builtin.env', 'DEMO_BACKEND', default='cnv') }}"
demo_webapp_mcp_material_lookup: "{{ lookup('ansible.builtin.env', 'DEMO_WEBAPP_MCP_MATERIAL', default='{}') | from_json }}"
demo_aws_credentials:
  access_key_id_lookup: "{{ lookup('ansible.builtin.env', 'DEMO_AWS_ACCESS_KEY_ID') }}"
  secret_access_key_lookup: "{{ lookup('ansible.builtin.env', 'DEMO_AWS_SECRET_ACCESS_KEY') }}"
  region: "{{ lookup('ansible.builtin.env', 'DEMO_AWS_REGION') }}"
  guest_config: "{{ lookup('ansible.builtin.env', 'DEMO_AWS_CONFIG') | from_json }}"
controller_credentials: >-
  {{ (demo_controller_credentials | rejectattr('name', 'equalto', 'demo-rhel-entitlement') | list)
     + demo_controller_aws_credentials if demo_backend == 'aws' else demo_controller_credentials }}
demo_controller_aws_credentials:
  - name: demo-pythonapp-ssh
    organization: demo
    credential_type: Machine
    state: present
    inputs:
      username: ec2-user
      ssh_key_data: "{{ demo_vm_credentials.ssh_private_lookup }}"
      become_method: sudo
  - name: demo-aws-guest
    organization: demo
    credential_type: Demo AWS guest
    state: present
    inputs:
      access_key_id: "{{ demo_aws_credentials.access_key_id_lookup }}"
      secret_access_key: "{{ demo_aws_credentials.secret_access_key_lookup }}"
      region: "{{ demo_aws_credentials.region }}"
      guest_config: "{{ demo_aws_credentials.guest_config | to_json }}"
demo_controller_credentials:
  - name: demo-webapp-mcp
    organization: demo
    credential_type: Demo Webapp MCP
    state: present
    inputs:
      material: "{{ demo_webapp_mcp_material_lookup | to_json }}"
  - name: demo-virtualmachine-admin
    organization: demo
    credential_type: Demo VM API
    state: present
    inputs:
      kube_api_host: "{{ demo_vm_credentials.api_host }}"
      kube_api_token: "{{ demo_vm_credentials.api_token_lookup }}"
      kube_api_ca: "{{ demo_vm_credentials.api_ca }}"
      ssh_public_key: "{{ demo_vm_credentials.ssh_public }}"
  - name: demo-webapp-ssh
    organization: demo
    credential_type: Machine
    state: present
    inputs:
      username: "{{ 'ec2-user' if demo_backend == 'aws' else 'cloud-user' }}"
      ssh_key_data: "{{ demo_vm_credentials.ssh_private_lookup }}"
      become_method: sudo
  - name: demo-rhel-entitlement
    organization: demo
    credential_type: Demo RHEL entitlement
    state: present
    inputs:
      entitlement_pem: "{{ demo_vm_credentials.entitlement_lookup }}"
  - name: demo-forgejo-issues
    organization: demo
    credential_type: Demo Forgejo issues
    state: present
    inputs:
      token: "{{ demo_forgejo_credentials.token_lookup }}"
  - name: demo-automation-orchestrator-service-account
    organization: demo
    credential_type: Automation Orchestrator Service Account
    state: present
    inputs:
      ao_webhook_client_id: "{{ demo_automation_orchestrator_credentials.client_id_lookup }}"
      ao_webhook_client_secret: "{{ demo_automation_orchestrator_credentials.client_secret_lookup }}"
