  repository: demo-owner/ansible-collection-demo.webapp
  title: "[WebappDown] Demo webapp is unavailable"
  marker: "<!-- demojam-webapp-outage -->"
  credentials:
    token_lookup: "{{ lookup('ansible.builtin.env', 'FORGEJO_API_TOKEN') }}"
