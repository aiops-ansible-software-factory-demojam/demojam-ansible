---
- name: Verify the AAP MCP credential file serialization contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../inventory/group_vars/aap/credentials.yml
  tasks:
    - name: Require serialized JSON with the supplied inventory material intact
      ansible.builtin.assert:
        that:
          - demo_controller_credentials[0].inputs.material is string
          - demo_controller_credentials[0].inputs.material | from_json == demo_webapp_mcp_material_lookup
        fail_msg: AAP needs JSON text for its credential file, not a native dictionary.
