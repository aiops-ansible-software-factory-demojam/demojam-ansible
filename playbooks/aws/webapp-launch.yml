---
- name: Provision or remove the AWS RHEL webapp
  hosts: "{{ host | default('openshift_clusters') }}"
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/openshift_clusters/aws.yml
  module_defaults:
    group/amazon.aws.aws:
      region: "{{ webapp_aws_config.region }}"
  tasks:
    - name: Validate the bootstrap-owned guest configuration
      ansible.builtin.assert:
        that:
          - webapp_aws_state in ['present', 'absent']
          - webapp_aws_config.deployment_id is match('^dj-[a-f0-9]{12}$')
          - webapp_aws_config.subnet_id is match('^subnet-[a-f0-9]+$')
          - webapp_aws_config.rhel9_ami_id is match('^ami-[a-f0-9]+$')
          - webapp_aws_config.webapp_key_name is match('^demojam-dj-[a-f0-9]{12}-webapp$')

    - name: Find the deployment's monitored guest
      amazon.aws.ec2_instance_info:
        filters:
          "tag:demojam:deployment": "{{ webapp_aws_config.deployment_id }}"
          "tag:demojam:purpose": webapp
          instance-state-name: [pending, running, stopping, stopped, shutting-down]
      register: webapp_aws_existing

    - name: Require an unambiguous monitored host
      ansible.builtin.assert:
        that: webapp_aws_existing.instances | length <= 1

    - name: Provision the RHEL 9 guest
      when: webapp_aws_state == 'present'
      block:
        - name: Describe the pinned RHEL 9 image
          amazon.aws.ec2_ami_info:
            image_ids: ["{{ webapp_aws_config.rhel9_ami_id }}"]
          register: webapp_aws_image

        - name: Start the monitored RHEL 9 instance
          amazon.aws.ec2_instance:
            name: webapp
            image_id: "{{ webapp_aws_config.rhel9_ami_id }}"
            instance_type: "{{ webapp_aws_config.webapp_instance_type }}"
            vpc_subnet_id: "{{ webapp_aws_config.subnet_id }}"
            security_groups: ["{{ webapp_aws_config.webapp_security_group_id }}"]
            key_name: "{{ webapp_aws_config.webapp_key_name }}"
            state: running
            wait: true
            wait_timeout: 600
            network:
              assign_public_ip: true
            metadata_options:
              http_tokens: required
              http_endpoint: enabled
            tags:
              "demojam:deployment": "{{ webapp_aws_config.deployment_id }}"
              "demojam:purpose": webapp
            volumes:
              - device_name: "{{ webapp_aws_image.images[0].root_device_name }}"
                ebs:
                  volume_type: gp3
                  encrypted: true
                  delete_on_termination: true
                  volume_size: >-
                    {{ [webapp_aws_config.root_volume_size | int,
                        (webapp_aws_image.images[0].block_device_mappings
                         | selectattr('device_name', 'equalto', webapp_aws_image.images[0].root_device_name)
                         | first).ebs.volume_size | int] | max }}
            filters:
              "tag:demojam:deployment": "{{ webapp_aws_config.deployment_id }}"
              "tag:demojam:purpose": webapp
              instance-state-name: [pending, running, stopping, stopped]
          register: webapp_aws_guest

        - name: Require the public instance address
          ansible.builtin.assert:
            that:
              - webapp_aws_guest.instances | length == 1
              - webapp_aws_guest.instances[0].public_ip_address | default('') | length > 0

        - name: Publish the guest endpoints for the existing Services
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: discovery.k8s.io/v1
              kind: EndpointSlice
              metadata:
                name: "{{ item.name }}-aws"
                namespace: webapp-vms
                labels:
                  kubernetes.io/service-name: "{{ item.name }}"
                  endpointslice.kubernetes.io/managed-by: demojam-aap
              addressType: IPv4
              ports:
                - name: "{{ item.port_name }}"
                  protocol: TCP
                  port: "{{ item.port }}"
              endpoints:
                - addresses: ["{{ webapp_aws_guest.instances[0].public_ip_address }}"]
                  conditions:
                    ready: true
          loop:
            - {name: webapp, port_name: http, port: 80}
            - {name: webapp-ssh, port_name: ssh, port: 22}

    - name: Remove the monitored guest
      when: webapp_aws_state == 'absent'
      block:
        - name: Remove stale guest endpoints
          kubernetes.core.k8s:
            api_version: discovery.k8s.io/v1
            kind: EndpointSlice
            namespace: webapp-vms
            name: "{{ item }}-aws"
            state: absent
          loop: [webapp, webapp-ssh]

        - name: Record root disk IDs
          ansible.builtin.set_fact:
            webapp_aws_volume_ids: >-
              {{ webapp_aws_existing.instances | map(attribute='block_device_mappings') | flatten
                 | selectattr('ebs', 'defined') | map(attribute='ebs.volume_id') | list }}

        - name: Terminate the owned instance
          amazon.aws.ec2_instance:
            instance_ids: "{{ webapp_aws_existing.instances | map(attribute='instance_id') | list }}"
            state: absent
            wait: true
          when: webapp_aws_existing.instances | length > 0

        - name: Verify the root disks were removed
          amazon.aws.ec2_vol_info:
            filters:
              volume-id: "{{ webapp_aws_volume_ids }}"
          register: webapp_aws_deleted_volumes
          until: webapp_aws_deleted_volumes.volumes | length == 0
          retries: 30
          delay: 5
          when: webapp_aws_volume_ids | length > 0
