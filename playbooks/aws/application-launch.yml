---
- name: application-launch | Provision or remove the AWS RHEL application
  hosts: "{{ host | default('openshift_clusters') }}"
  connection: local
  gather_facts: false
  vars:
    application_aws_config: "{{ lookup('ansible.builtin.env', 'DEMO_AWS_CONFIG') | from_json }}"
    application_aws_state: "{{ vm_state | default('present') }}"
  module_defaults:
    group/amazon.aws.aws:
      region: "{{ application_aws_config.region }}"
  tasks:
    - name: application-launch | Validate the bootstrap-owned guest configuration
      ansible.builtin.assert:
        that:
          - aws_application_name in ['webapp', 'pythonapp']
          - application_aws_state in ['present', 'absent']
          - application_aws_config.deployment_id is match('^dj-[a-f0-9]{12}$')
          - application_aws_config.subnet_id is match('^subnet-[a-f0-9]+$')
          - application_aws_config.rhel9_ami_id is match('^ami-[a-f0-9]+$')
          - application_aws_config[aws_application_name + '_key_name'] is match('^demojam-dj-[a-f0-9]{12}-' + aws_application_name + '$')

    - name: application-launch | Find the deployment's monitored guest
      amazon.aws.ec2_instance_info:
        filters:
          "tag:demojam:deployment": "{{ application_aws_config.deployment_id }}"
          "tag:demojam:purpose": "{{ aws_application_name }}"
          instance-state-name: [pending, running, stopping, stopped, shutting-down]
      register: application_aws_existing

    - name: application-launch | Require an unambiguous monitored host
      ansible.builtin.assert:
        that: application_aws_existing.instances | length <= 1

    - name: application-launch | Provision the RHEL 9 guest
      when: application_aws_state == 'present'
      block:
        - name: application-launch | Describe the pinned RHEL 9 image
          amazon.aws.ec2_ami_info:
            image_ids: ["{{ application_aws_config.rhel9_ami_id }}"]
          register: application_aws_image

        - name: application-launch | Start the monitored RHEL 9 instance
          amazon.aws.ec2_instance:
            name: "{{ aws_application_name }}"
            image_id: "{{ application_aws_config.rhel9_ami_id }}"
            instance_type: "{{ application_aws_config[aws_application_name + '_instance_type'] }}"
            vpc_subnet_id: "{{ application_aws_config.subnet_id }}"
            security_groups: ["{{ application_aws_config[aws_application_name + '_security_group_id'] }}"]
            key_name: "{{ application_aws_config[aws_application_name + '_key_name'] }}"
            state: running
            wait: true
            wait_timeout: 600
            network:
              assign_public_ip: true
            metadata_options:
              http_tokens: required
              http_endpoint: enabled
            tags:
              "demojam:deployment": "{{ application_aws_config.deployment_id }}"
              "demojam:purpose": "{{ aws_application_name }}"
            volumes:
              - device_name: "{{ application_aws_image.images[0].root_device_name }}"
                ebs:
                  volume_type: gp3
                  encrypted: true
                  delete_on_termination: true
                  volume_size: >-
                    {{ [application_aws_config.root_volume_size | int,
                        (application_aws_image.images[0].block_device_mappings
                         | selectattr('device_name', 'equalto', application_aws_image.images[0].root_device_name)
                         | first).ebs.volume_size | int] | max }}
            filters:
              "tag:demojam:deployment": "{{ application_aws_config.deployment_id }}"
              "tag:demojam:purpose": "{{ aws_application_name }}"
              instance-state-name: [pending, running, stopping, stopped]
          register: application_aws_guest

        - name: application-launch | Require the public instance address
          ansible.builtin.assert:
            that:
              - application_aws_guest.instances | length == 1
              - application_aws_guest.instances[0].public_ip_address | default('') | length > 0

        - name: application-launch | Publish the guest endpoints for the existing Services
          kubernetes.core.k8s:
            state: present
            definition: |
              apiVersion: discovery.k8s.io/v1
              kind: EndpointSlice
              metadata:
                name: {{ item.name }}-aws
                namespace: {{ aws_application_name }}-vms
                labels:
                  kubernetes.io/service-name: {{ item.name }}
                  endpointslice.kubernetes.io/managed-by: demojam-aap
              addressType: IPv4
              ports:
                - name: application-launch | {{ item.port_name }}
                  protocol: TCP
                  port: {{ item.port }}
              endpoints:
                - addresses: ["{{ application_aws_guest.instances[0].public_ip_address }}"]
                  conditions:
                    ready: true
          loop:
            - {name: '{{ aws_application_name }}', port_name: http, port: 80}
            - {name: '{{ aws_application_name }}-ssh', port_name: ssh, port: 22}

    - name: application-launch | Remove the monitored guest
      when: application_aws_state == 'absent'
      block:
        - name: application-launch | Remove stale guest endpoints
          kubernetes.core.k8s:
            api_version: discovery.k8s.io/v1
            kind: EndpointSlice
            namespace: "{{ aws_application_name }}-vms"
            name: "{{ item }}-aws"
            state: absent
          loop: ['{{ aws_application_name }}', '{{ aws_application_name }}-ssh']

        - name: application-launch | Record root disk IDs
          ansible.builtin.set_fact:
            application_aws_volume_ids: >-
              {{ application_aws_existing.instances | map(attribute='block_device_mappings') | flatten
                 | selectattr('ebs', 'defined') | map(attribute='ebs.volume_id') | list }}

        - name: application-launch | Terminate the owned instance
          amazon.aws.ec2_instance:
            instance_ids: "{{ application_aws_existing.instances | map(attribute='instance_id') | list }}"
            state: absent
            wait: true
          when: application_aws_existing.instances | length > 0

        - name: application-launch | Verify the root disks were removed
          amazon.aws.ec2_vol_info:
            filters:
              volume-id: "{{ application_aws_volume_ids }}"
          register: application_aws_deleted_volumes
          until: application_aws_deleted_volumes.volumes | length == 0
          retries: 30
          delay: 5
          when: application_aws_volume_ids | length > 0
