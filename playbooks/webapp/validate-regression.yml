---
- name: Independently validate authored nginx regression coverage
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    webapp_regression_file: extensions/molecule/nginx/tasks/regression.yml
  tasks:
    - name: Require exact source identities and an independent operator workspace
      ansible.builtin.assert:
        that:
          - webapp_candidate_sha is match('^[0-9a-f]{40}$')
          - webapp_base_sha is match('^[0-9a-f]{40}$')
          - webapp_base_sha != webapp_candidate_sha
          - webapp_source_directory is match('^/')
    - name: Read the published workspace source
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: '{{ webapp_source_directory }}'
      register: webapp_head_before
      changed_when: false
      failed_when: webapp_head_before.stdout | trim != webapp_candidate_sha
    - name: Require a clean tracked source workspace
      ansible.builtin.command:
        argv: [git, diff, --exit-code, HEAD, --]
        chdir: '{{ webapp_source_directory }}'
      changed_when: false
    - name: Require the original source to be an ancestor of the fix
      ansible.builtin.command:
        argv: [git, merge-base, --is-ancestor, '{{ webapp_base_sha }}', '{{ webapp_candidate_sha }}']
        chdir: '{{ webapp_source_directory }}'
      changed_when: false
    - name: Require authored regression changes rather than an unchanged test suite
      ansible.builtin.command:
        argv: [git, diff, --quiet, '{{ webapp_base_sha }}', '{{ webapp_candidate_sha }}', --, '{{ webapp_regression_file }}']
        chdir: '{{ webapp_source_directory }}'
      register: webapp_regression_diff
      changed_when: false
      failed_when: webapp_regression_diff.rc != 1
    - name: Allocate independent source exports and receipts
      ansible.builtin.tempfile:
        state: directory
        prefix: webapp-regression-
      register: webapp_validation_directory
    - name: Prepare exported source roots and receipts
      ansible.builtin.file:
        path: '{{ webapp_validation_directory.path }}/{{ item }}'
        state: directory
        mode: '0700'
      loop: [before, after, receipts, dependencies, artifacts]
    - name: Export only the exact original and published commits
      ansible.builtin.command:
        argv: [git, archive, --format=tar, '--output={{ webapp_validation_directory.path }}/{{ item.phase }}.tar', '{{ item.sha }}']
        chdir: '{{ webapp_source_directory }}'
      loop:
        - {phase: before, sha: '{{ webapp_base_sha }}'}
        - {phase: after, sha: '{{ webapp_candidate_sha }}'}
      changed_when: false
    - name: Extract original and repaired code without changing the author workspace
      ansible.builtin.unarchive:
        src: '{{ webapp_validation_directory.path }}/{{ item }}.tar'
        dest: '{{ webapp_validation_directory.path }}/{{ item }}'
        remote_src: true
      loop: [before, after]
    - name: Read the exact authored regression task list
      ansible.builtin.set_fact:
        webapp_authored_regression: '{{ lookup("ansible.builtin.file", webapp_validation_directory.path ~ "/after/" ~ webapp_regression_file) | from_yaml }}'
    - name: Require an explicit executable assertion in the authored regression
      ansible.builtin.assert:
        that:
          - webapp_authored_regression is sequence
          - webapp_authored_regression is not string
          - webapp_authored_regression | map('dict2items') | flatten | selectattr('key', 'equalto', 'ansible.builtin.assert') | list | length > 0
    - name: Read the authored Molecule verification entry point
      ansible.builtin.set_fact:
        webapp_authored_verify: >-
          {{ lookup('ansible.builtin.file', webapp_validation_directory.path ~ '/after/extensions/molecule/nginx/verify.yml') | from_yaml }}
    - name: Record the immutable authored regression bytes
      ansible.builtin.stat:
        path: '{{ webapp_validation_directory.path }}/after/{{ webapp_regression_file }}'
        checksum_algorithm: sha256
      register: webapp_regression_before
    - name: Require the regression tasks to run in the ordinary authored scenario too
      ansible.builtin.assert:
        that: >-
          webapp_authored_verify | selectattr('tasks', 'defined') | map(attribute='tasks') | flatten
          | map('dict2items') | flatten
          | selectattr('key', 'in', ['ansible.builtin.import_tasks', 'ansible.builtin.include_tasks'])
          | selectattr('value', 'equalto', 'tasks/regression.yml') | list | length > 0
    - name: Copy independently maintained lifecycle and relabel checks
      ansible.builtin.copy:
        src: regression/
        dest: '{{ webapp_validation_directory.path }}/harness/'
        mode: preserve
    - name: Select an isolated dependency root while retaining provisioner credentials and tools
      ansible.builtin.set_fact:
        webapp_validation_environment:
          ANSIBLE_COLLECTIONS_PATH: >-
            {{ webapp_validation_directory.path }}/dependencies:{{ lookup('ansible.builtin.env',
            'ANSIBLE_COLLECTIONS_PATH', default='/usr/share/ansible/collections') }}
    - name: Run the independent regression validation
      block:
        - name: Install declared candidate dependencies into the isolated validation root
          ansible.builtin.command:
            argv:
              - ansible-galaxy
              - collection
              - install
              - -r
              - collections/requirements.yml
              - -p
              - '{{ webapp_validation_directory.path }}/dependencies'
            chdir: '{{ webapp_validation_directory.path }}/after'
          environment: '{{ webapp_validation_environment }}'
          changed_when: false
        - name: Lint the exact candidate role and authored scenario
          ansible.builtin.command:
            argv: [ansible-lint, roles/nginx, extensions/molecule/nginx]
            chdir: '{{ webapp_validation_directory.path }}/after'
          environment: '{{ webapp_validation_environment }}'
          changed_when: false
        - name: Build the exact candidate collection
          ansible.builtin.command:
            argv: [ansible-galaxy, collection, build, --force, --output-path, '{{ webapp_validation_directory.path }}/artifacts']
            chdir: '{{ webapp_validation_directory.path }}/after'
          environment: '{{ webapp_validation_environment }}'
          changed_when: false
        - name: Exercise the identical regression on original and repaired guests
          ansible.builtin.include_tasks: regression/cycle.yml
          loop: [before, after]
          loop_control:
            loop_var: webapp_regression_phase
          vars:
            webapp_regression_environment: >-
              {{ webapp_validation_environment | combine({
              'WEBAPP_REGRESSION_SOURCE': webapp_validation_directory.path ~ '/' ~ webapp_regression_phase,
              'WEBAPP_REGRESSION_PHASE': webapp_regression_phase,
              'WEBAPP_AUTHORED_REGRESSION': webapp_validation_directory.path ~ '/after/' ~ webapp_regression_file,
              'WEBAPP_REGRESSION_RECEIPTS': webapp_validation_directory.path ~ '/receipts',
              'MOLECULE_GLOB': 'molecule/molecule.yml'}) }}
        - name: Read all independently produced host receipts
          ansible.builtin.find:
            paths: '{{ webapp_validation_directory.path }}/receipts'
            patterns: '*.json'
          register: webapp_regression_receipts
        - name: Require every original and repaired guest verdict
          ansible.builtin.assert:
            that: >-
              webapp_regression_receipts.files | map(attribute='path') | map('basename') | sort ==
              (['after-rhel10.json', 'after-rhel9.json', 'before-rhel10.json', 'before-rhel9.json']
              if lookup('ansible.builtin.env', 'PROVISIONER', default='kubevirt') == 'aws'
              else ['after-centos-stream10.json', 'before-centos-stream10.json'])
        - name: Read the regression bytes after both lifecycles
          ansible.builtin.stat:
            path: '{{ webapp_validation_directory.path }}/after/{{ webapp_regression_file }}'
            checksum_algorithm: sha256
          register: webapp_regression_after
        - name: Require the identical authored test to remain unchanged throughout validation
          ansible.builtin.assert:
            that: webapp_regression_after.stat.checksum == webapp_regression_before.stat.checksum
        - name: Require the author workspace to remain unchanged
          ansible.builtin.command:
            argv: [git, diff, --exit-code, HEAD, --]
            chdir: '{{ webapp_source_directory }}'
          changed_when: false
        - name: Require the original published head after all machine tests
          ansible.builtin.command:
            argv: [git, rev-parse, HEAD]
            chdir: '{{ webapp_source_directory }}'
          register: webapp_head_after
          changed_when: false
          failed_when: webapp_head_after.stdout | trim != webapp_candidate_sha
        - name: Record independent regression evidence
          ansible.builtin.copy:
            dest: '{{ webapp_validation_directory.path }}/result.json'
            mode: '0600'
            content: >-
              {{ {'passed': true, 'source_revision': webapp_candidate_sha, 'base_revision': webapp_base_sha,
              'regression_sha256': webapp_regression_before.stat.checksum,
              'suite': 'webapp-regression-v1', 'red': true, 'green': true, 'durable': true} | to_json }}
        - name: Report where the independent receipts are retained
          ansible.builtin.debug:
            msg:
              receipts_directory: '{{ webapp_validation_directory.path }}'
              result: '{{ lookup("ansible.builtin.file", webapp_validation_directory.path ~ "/result.json") | from_json }}'
        - name: Return the receipt to the calling trusted CI runner
          when: webapp_validation_receipt_destination is defined
          ansible.builtin.copy:
            dest: '{{ webapp_validation_receipt_destination }}'
            mode: '0600'
            content: '{{ lookup("ansible.builtin.file", webapp_validation_directory.path ~ "/result.json") }}'
      rescue:
        - name: Keep failed independent validation unsuccessful
          ansible.builtin.fail:
            msg: 'Independent nginx regression failed; inspect {{ webapp_validation_directory.path }} and owned test resources.'
