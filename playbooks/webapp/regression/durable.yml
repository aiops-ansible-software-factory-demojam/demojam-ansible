---
- name: Read the persistent SELinux file-context mapping
  ansible.builtin.command:
    argv: [matchpathcon, -n, '{{ nginx_docroot }}']
  register: webapp_persistent_context
  changed_when: false
- name: Require a persistent nginx content policy rather than a one-time label
  ansible.builtin.assert:
    that: "'httpd_sys_content_t' in webapp_persistent_context.stdout"
- name: Deliberately invalidate disposable guest content labels
  ansible.builtin.command:
    argv: [chcon, -R, -t, default_t, '{{ nginx_docroot }}']
  changed_when: true
- name: Restore labels using the installed persistent policy
  ansible.builtin.command:
    argv: [restorecon, -RFv, '{{ nginx_docroot }}']
  register: webapp_relabel
  changed_when: webapp_relabel.stdout | length > 0
- name: Read SELinux mode after relabeling
  ansible.builtin.command: getenforce
  register: webapp_relabel_mode
  changed_when: false
- name: Require enforcing mode after relabeling
  ansible.builtin.assert:
    that: webapp_relabel_mode.stdout | trim == 'Enforcing'
- name: Require HTTP recovery after the trusted relabel challenge
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ nginx_listen_port | default(80) }}/'
    status_code: 200
    return_content: true
  register: webapp_relabel_http
- name: Require the configured page after relabeling
  ansible.builtin.assert:
    that: nginx_index_content in webapp_relabel_http.content
