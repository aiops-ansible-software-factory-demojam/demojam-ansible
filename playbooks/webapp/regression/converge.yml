---
- name: Exercise the original or repaired role on disposable guests only
  hosts: molecule
  become: true
  gather_facts: false
  vars_files:
    - '{{ lookup("ansible.builtin.env", "WEBAPP_REGRESSION_SOURCE") }}/vars/webapp.yml'
  pre_tasks:
    - name: Require the trusted disposable inventory and test phase
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | sort == groups['molecule'] | sort
          - lookup('ansible.builtin.env', 'WEBAPP_REGRESSION_PHASE') in ['before', 'after']
          - lookup('ansible.builtin.env', 'PROVISIONER', default='kubevirt') != 'aws' or groups['molecule'] | sort == ['rhel10', 'rhel9']
    # Fixture setup lets the original role install its intentionally broken
    # baseline. Suppress fixture toggles only; role idempotence remains checked.
    - name: Prepare permissive mode only for the original-code fixture
      when: lookup('ansible.builtin.env', 'WEBAPP_REGRESSION_PHASE') == 'before'
      ansible.posix.selinux:
        policy: targeted
        state: permissive
      changed_when: false
  roles:
    - role: nginx
  post_tasks:
    - name: Finish nginx handlers before enforcing verification
      ansible.builtin.meta: flush_handlers
    - name: Require enforcing mode for regression verification
      ansible.posix.selinux:
        policy: targeted
        state: enforcing
      changed_when: false
