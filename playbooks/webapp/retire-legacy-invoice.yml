---
- name: retire-legacy-invoice | Retire the former invoice service only from nginx application hosts
  hosts: webapps
  become: true
  gather_facts: false
  tasks:
    - name: retire-legacy-invoice | Discover legacy services without changing application releases
      ansible.builtin.service_facts:

    - name: retire-legacy-invoice | Stop the legacy invoice unit on the nginx host
      ansible.builtin.systemd_service:
        name: invoice-portal
        state: stopped
        enabled: false
      when: "'invoice-portal.service' in ansible_facts.services"
