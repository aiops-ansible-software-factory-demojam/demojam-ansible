---
- name: Check the exact merged web incident and native production approval
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vars/webapp/promotion.yml
  tasks:
    - name: Require an exact web incident source identity
      ansible.builtin.assert:
        that:
          - webapp_candidate_sha is match('^[0-9a-f]{40}$')
          - webapp_issue_number | int > 0
          - webapp_pr_number | int > 0
          - awx_workflow_job_id | default(0) | int > 0
          - awx_workflow_job_name | default('') == 'webapp_promote'
          - groups['webapps'] | default([]) | length > 0
          - groups['webapps'] | intersect(groups['pythonapps'] | default([])) | length == 0
    - name: Independently require human merge of the unchanged web incident PR
      ansible.builtin.uri:
        url: >-
          http://backstage-feature-gate.automation-orchestrator.svc:8080/webapp/pr?issue_number={{ webapp_issue_number
          }}&pr_number={{ webapp_pr_number }}&head_sha={{ webapp_candidate_sha }}&require_merged=true
        return_content: true
        status_code: 200
      register: webapp_merged_pr
      check_mode: false
    - name: Require the matching incident commit in main
      ansible.builtin.assert:
        that:
          - webapp_merged_pr.json.merged | bool
          - webapp_merged_pr.json.head_sha == webapp_candidate_sha
          - webapp_merged_pr.json.regression_validated | default(false) | bool
    - name: Read this native production execution
      ansible.builtin.uri:
        url: '{{ webapp_review_api }}/workflow_jobs/{{ awx_workflow_job_id }}/'
        url_username: '{{ webapp_review_username }}'
        url_password: '{{ webapp_review_password }}'
        force_basic_auth: true
        validate_certs: true
        return_content: true
      register: webapp_promotion_workflow
      no_log: true
      check_mode: false
    - name: Read this execution approval and gate identities
      ansible.builtin.uri:
        url: '{{ webapp_review_api }}/workflow_jobs/{{ awx_workflow_job_id }}/workflow_nodes/?page_size=20'
        url_username: '{{ webapp_review_username }}'
        url_password: '{{ webapp_review_password }}'
        force_basic_auth: true
        validate_certs: true
        return_content: true
      register: webapp_promotion_nodes
      no_log: true
      check_mode: false
    - name: Construct the reviewed web release identity
      ansible.builtin.set_fact:
        webapp_checked_contract:
          schema_version: 1
          hosts: '{{ groups["webapps"] | sort }}'
          repository: demo-owner/ansible-collection-demo.webapp
          source_revision: '{{ webapp_candidate_sha }}'
          issue_number: '{{ webapp_issue_number | int }}'
          pr_number: '{{ webapp_pr_number | int }}'
        webapp_promotion_approval: '{{ webapp_promotion_nodes.json.results | selectattr("identifier", "equalto", "production-approval") | list }}'
        webapp_promotion_gate: '{{ webapp_promotion_nodes.json.results | selectattr("identifier", "equalto", "recheck-release") | list }}'
    - name: Bind this native execution to the exact reviewed source and incident
      ansible.builtin.assert:
        that:
          - webapp_promotion_workflow.json.name == 'webapp_promote'
          - webapp_promotion_workflow.json.scm_branch == webapp_candidate_sha
          - (webapp_promotion_workflow.json.extra_vars | from_json).webapp_candidate_sha == webapp_candidate_sha
          - (webapp_promotion_workflow.json.extra_vars | from_json).webapp_issue_number | int == webapp_issue_number | int
          - (webapp_promotion_workflow.json.extra_vars | from_json).webapp_pr_number | int == webapp_pr_number | int
          - webapp_promotion_nodes.json.count == 4
    - name: Reject a changed inherited release contract
      when: webapp_release_contract is defined
      ansible.builtin.assert:
        that: webapp_release_contract == webapp_checked_contract
    - name: Require this exact execution approval before deployment
      when: webapp_require_production_approval | default(false) | bool
      ansible.builtin.assert:
        that:
          - webapp_promotion_approval | length == 1
          - webapp_promotion_gate | length == 1
          - webapp_promotion_approval[0].summary_fields.job.type == 'workflow_approval'
          - webapp_promotion_approval[0].summary_fields.job.status == 'successful'
          - webapp_promotion_gate[0].job | int == awx_job_id | int
    - name: Expose the independently checked release for deployment
      ansible.builtin.set_stats:
        aggregate: false
        data:
          webapp_release_contract: '{{ webapp_checked_contract }}'
