---
- name: mcp-install | Manage read-only MCP diagnostics on the RHEL webapp
  hosts: webapps
  become: true
  gather_facts: true
  vars_files:
    - ../../inventory/group_vars/webapps.yml
  handlers:
    - name: mcp-install | Reload audit configuration
      # RHEL requires the service command for auditd signal handling.
      ansible.builtin.command:
        argv: [service, auditd, reload]
      changed_when: true
    - name: mcp-install | Restart webapp MCP
      ansible.builtin.systemd_service:
        name: webapp-mcp
        daemon_reload: true
        state: restarted
  tasks:
    - name: mcp-install | Require the supported guest and lifecycle state
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in ['RedHat', 'CentOS', 'Rocky']
          - ansible_facts['distribution_major_version'] | int >= 9
          - ansible_facts['architecture'] == 'x86_64'
          - webapp_mcp_state | default('present') in ['present', 'absent']
        fail_msg: Webapp MCP supports RHEL-compatible x86_64 guests with Python 3.12.

    - name: mcp-install | Validate bootstrap-supplied service material before changing the host
      when: webapp_mcp_state | default('present') == 'present'
      ansible.builtin.assert:
        that:
          - webapp_mcp_material_lookup.jwt_issuer is match('^https?://')
          - webapp_mcp_material_lookup.jwt_jwks_uri is match('^https?://')
          - webapp_mcp_material_lookup.jwt_ca | length > 0
          - webapp_mcp_material_lookup.jwt_id is match('^[a-zA-Z0-9:_-]+$')
          - webapp_mcp_material_lookup.expires_at | int > ansible_facts['date_time']['epoch'] | int
          - webapp_mcp_material_lookup.tls_cert | length > 0
          - webapp_mcp_material_lookup.tls_key | length > 0
          - webapp_mcp_material_lookup.ca_cert | length > 0
      no_log: true

    - name: mcp-install | Discover installed services
      ansible.builtin.service_facts:

    - name: mcp-install | Stop the retired audit refresh timer
      ansible.builtin.systemd_service:
        name: webapp-mcp-audit.timer
        enabled: false
        state: stopped
      when: "'webapp-mcp-audit.service' in ansible_facts['services']"

    - name: mcp-install | Stop the retired audit collector
      ansible.builtin.systemd_service:
        name: webapp-mcp-audit.service
        enabled: false
        state: stopped
      when: "'webapp-mcp-audit.service' in ansible_facts['services']"

    - name: mcp-install | Remove the retired collector and authentication adapter
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/webapp-mcp-audit.timer
        - /etc/systemd/system/webapp-mcp-audit.service
        - /run/webapp-mcp-audit
        - /opt/webapp-mcp/server.py
        - /opt/webapp-mcp/webapp_mcp_audit.py
        - /etc/webapp-mcp/credential.json

    - name: mcp-install | Stop diagnostics when disabled
      when: webapp_mcp_state | default('present') == 'absent'
      block:
        - name: mcp-install | Stop and disable the installed diagnostics service
          ansible.builtin.systemd_service:
            name: webapp-mcp
            daemon_reload: true
            enabled: false
            state: stopped
          when: "'webapp-mcp.service' in ansible_facts['services']"
        - name: mcp-install | Restore root-only audit log rotation
          ansible.builtin.lineinfile:
            path: /etc/audit/auditd.conf
            regexp: '^log_group\s*='
            line: log_group = root
          when: "'auditd.service' in ansible_facts['services']"
          notify: Reload audit configuration
        - name: mcp-install | Restore root-only audit file access
          ansible.builtin.file:
            path: /var/log/audit/audit.log
            owner: root
            group: root
            mode: '0600'
          when: "'auditd.service' in ansible_facts['services']"
        - name: mcp-install | Restore root-only audit directory access
          ansible.builtin.file:
            path: /var/log/audit
            owner: root
            group: root
            mode: '0700'
          when: "'auditd.service' in ansible_facts['services']"
        - name: mcp-install | Close the diagnostics firewall port
          ansible.posix.firewalld:
            port: 8443/tcp
            state: disabled
            permanent: true
            immediate: true
            offline: true
          when: "'firewalld.service' in ansible_facts['services']"
        - name: mcp-install | Remove guest authentication and TLS material
          ansible.builtin.file:
            path: /etc/webapp-mcp
            state: absent

    - name: mcp-install | Install and configure diagnostics
      when: webapp_mcp_state | default('present') == 'present'
      block:
        - name: mcp-install | Install the isolated runtime and diagnostic command dependencies
          ansible.builtin.package:
            name:
              - python3.12
              - python3.12-pip
              - acl
              - audit
              - ca-certificates
              - coreutils
              - grep
              - hostname
              - iproute
              - procps-ng
              - systemd
              - util-linux
              - firewalld
            state: present

        - name: mcp-install | Create the diagnostics group
          ansible.builtin.group:
            name: mcpdiag
            system: true

        - name: mcp-install | Create an unprivileged diagnostics account
          ansible.builtin.user:
            name: mcpdiag
            group: mcpdiag
            groups: systemd-journal
            append: true
            system: true
            create_home: false
            shell: /sbin/nologin

        - name: mcp-install | Create root-owned application and configuration directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: mcpdiag
            mode: '0750'
          loop: [/opt/webapp-mcp, /etc/webapp-mcp]

        - name: mcp-install | Create the daemon log directory
          ansible.builtin.file:
            path: /var/log/webapp-mcp
            state: directory
            owner: mcpdiag
            group: mcpdiag
            mode: '0700'

        - name: mcp-install | Install the hashed dependency lock
          ansible.builtin.copy:
            src: webapp-mcp-requirements.txt
            dest: /opt/webapp-mcp/requirements.txt
            owner: root
            group: root
            mode: '0644'
          notify: Restart webapp MCP

        - name: mcp-install | Install verified Python dependencies in a dedicated environment
          ansible.builtin.pip:
            requirements: /opt/webapp-mcp/requirements.txt
            virtualenv: /opt/webapp-mcp/venv
            virtualenv_command: /usr/bin/python3.12 -m venv
            extra_args: '--require-hashes --only-binary=:all:'
          notify: Restart webapp MCP

        - name: mcp-install | Read the system CA bundle for issuer verification
          ansible.builtin.slurp:
            src: /etc/pki/tls/certs/ca-bundle.crt
          register: webapp_mcp_system_ca

        - name: mcp-install | Install public JWT trust and TLS material
          ansible.builtin.copy:
            dest: "/etc/webapp-mcp/{{ item.name }}"
            content: "{{ item.content }}"
            owner: root
            group: mcpdiag
            mode: '0640'
          loop:
            - name: mcp-install | jwt-ca.crt
              content: "{{ webapp_mcp_system_ca.content | b64decode }}\n{{ webapp_mcp_material_lookup.jwt_ca }}"
            - name: mcp-install | tls.crt
              content: "{{ webapp_mcp_material_lookup.tls_cert }}"
            - name: mcp-install | tls.key
              content: "{{ webapp_mcp_material_lookup.tls_key }}"
            - name: mcp-install | ca.crt
              content: "{{ webapp_mcp_material_lookup.ca_cert }}"
          no_log: true
          notify: Restart webapp MCP

        - name: mcp-install | Configure the service and authorization policy
          ansible.builtin.template:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            owner: root
            group: root
            mode: '0644'
          loop:
            - src: webapp-mcp.env.j2
              dest: /etc/webapp-mcp/server.env
            - src: webapp-mcp-policy.yaml.j2
              dest: /etc/webapp-mcp/policy.yaml
            - src: webapp-mcp.service.j2
              dest: /etc/systemd/system/webapp-mcp.service
          notify: Restart webapp MCP

        - name: mcp-install | Allow diagnostics to traverse the nginx log directory
          ansible.posix.acl:
            path: /var/log/nginx
            entity: mcpdiag
            etype: user
            permissions: rx
            state: present

        - name: mcp-install | Preserve diagnostic read access for new nginx logs
          ansible.posix.acl:
            path: /var/log/nginx
            entity: mcpdiag
            etype: user
            permissions: rx
            default: true
            state: present

        - name: mcp-install | Allow reading the selected existing nginx logs
          ansible.posix.acl:
            path: "/var/log/nginx/{{ item }}"
            entity: mcpdiag
            etype: user
            permissions: r
            state: present
          loop: [access.log, error.log]

        - name: mcp-install | Configure read access for auditd-created logs
          ansible.builtin.lineinfile:
            path: /etc/audit/auditd.conf
            regexp: '^log_group\s*='
            line: log_group = mcpdiag
          notify: Reload audit configuration

        - name: mcp-install | Allow diagnostics to traverse the audit directory
          ansible.builtin.file:
            path: /var/log/audit
            owner: root
            group: mcpdiag
            mode: '0750'

        - name: mcp-install | Enable native audit logging
          ansible.builtin.systemd_service:
            name: auditd
            enabled: true
            state: started

        - name: mcp-install | Allow diagnostics to read the current audit log
          ansible.builtin.file:
            path: /var/log/audit/audit.log
            owner: root
            group: mcpdiag
            mode: '0640'

        - name: mcp-install | Preserve HTTP and SSH while opening diagnostics before firewall startup
          ansible.posix.firewalld:
            port: "{{ item }}/tcp"
            state: enabled
            permanent: true
            immediate: true
            offline: true
          loop: [22, 80, 8443]

        - name: mcp-install | Enable the guest firewall with the approved ports configured
          ansible.builtin.systemd_service:
            name: firewalld
            enabled: true
            state: started

        - name: mcp-install | Apply pending service configuration
          ansible.builtin.meta: flush_handlers

        - name: mcp-install | Enable the diagnostics service
          ansible.builtin.systemd_service:
            name: webapp-mcp
            daemon_reload: true
            enabled: true
            state: started

        - name: mcp-install | Verify the guest TLS listener rejects unauthenticated requests
          ansible.builtin.uri:
            url: https://localhost:8443/mcp
            ca_path: /etc/webapp-mcp/ca.crt
            status_code: 401
          register: webapp_mcp_health
          until: webapp_mcp_health.status == 401
          retries: 12
          delay: 5
