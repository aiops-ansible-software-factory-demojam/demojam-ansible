---
- name: Require a native reusable workflow context
  ansible.builtin.assert:
    that:
      - awx_workflow_job_id | default(0) | int > 0
      - awx_workflow_job_name | default('') == 'invoice_promote'
- name: Read this promotion execution
  ansible.builtin.uri:
    url: '{{ invoice_review_api }}/workflow_jobs/{{ awx_workflow_job_id }}/'
    url_username: '{{ invoice_review_username }}'
    url_password: '{{ invoice_review_password }}'
    force_basic_auth: true
    validate_certs: true
    return_content: true
  register: invoice_approval_workflow
  no_log: true
  check_mode: false
- name: Read the human approval and current gate job
  ansible.builtin.uri:
    url: '{{ invoice_review_api }}/workflow_jobs/{{ awx_workflow_job_id }}/workflow_nodes/?page_size=20'
    url_username: '{{ invoice_review_username }}'
    url_password: '{{ invoice_review_password }}'
    force_basic_auth: true
    validate_certs: true
    return_content: true
  register: invoice_approval_nodes
  no_log: true
  check_mode: false
- name: Select the approval and this gate from the execution snapshot
  ansible.builtin.set_fact:
    invoice_approval_decision: '{{ invoice_approval_nodes.json.results | selectattr("identifier", "equalto", "production-approval") | list }}'
    invoice_approval_gate: '{{ invoice_approval_nodes.json.results | selectattr("identifier", "equalto", "recheck-release") | list }}'
- name: Require successful human approval of this exact contract and source
  ansible.builtin.assert:
    that:
      - invoice_approval_workflow.json.name == 'invoice_promote'
      - invoice_approval_workflow.json.scm_branch == invoice_candidate_sha
      - (invoice_approval_workflow.json.extra_vars | from_json).invoice_release_contract == invoice_checked_contract
      - invoice_approval_nodes.json.count == 4
      - invoice_approval_decision | length == 1
      - invoice_approval_gate | length == 1
      - invoice_approval_decision[0].summary_fields.job.type == 'workflow_approval'
      - invoice_approval_decision[0].summary_fields.job.status == 'successful'
      - invoice_approval_gate[0].job | int == awx_job_id | int
    fail_msg: This job does not prove approval of the exact promotion execution.
