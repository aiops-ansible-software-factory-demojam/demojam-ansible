---
- name: verify-deployment | Require human approval and exact source deployment before verification
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/orchestration.yml
  tasks:
    - name: verify-deployment | Require an exact release and workflow identity
      ansible.builtin.assert:
        that:
          - invoice_candidate_sha is match('^[0-9a-f]{40}$')
          - invoice_approved_wheel_sha256 is match('^[0-9a-f]{64}$')
          - invoice_deployment_workflow_id | int > 0
    - name: verify-deployment | Read the actual production workflow
      ansible.builtin.include_tasks: tasks/controller-read.yml
      vars:
        controller_read_path: 'workflow_jobs/{{ invoice_deployment_workflow_id }}/'
        controller_read_register: invoice_production_workflow
    - name: verify-deployment | Read the approval and deployment outcomes
      ansible.builtin.include_tasks: tasks/controller-read.yml
      vars:
        controller_read_path: 'workflow_jobs/{{ invoice_deployment_workflow_id }}/workflow_nodes/?page_size=20'
        controller_read_register: invoice_production_nodes
    - name: verify-deployment | Select the protected workflow nodes
      ansible.builtin.set_fact:
        invoice_production_approval: >-
          {{ invoice_production_nodes.json.results | selectattr('identifier', 'equalto', 'production-approval')
          | list }}
        invoice_production_deploy: >-
          {{ invoice_production_nodes.json.results | selectattr('identifier', 'equalto', 'deploy') | list }}
    - name: verify-deployment | Select both trusted release checks
      ansible.builtin.set_fact:
        invoice_production_guards: >-
          {{ invoice_production_nodes.json.results | selectattr('identifier', 'in', ['validate-release', 'recheck-release']) | list }}
        invoice_production_contract: '{{ (invoice_production_workflow.json.extra_vars | from_json).invoice_release_contract }}'
    - name: verify-deployment | Require successful approval and deployment in the exact release workflow
      ansible.builtin.assert:
        that:
          - invoice_production_workflow.json.status == 'successful'
          - invoice_production_workflow.json.name == 'invoice_promote'
          - invoice_production_workflow.json.scm_branch == invoice_candidate_sha
          - invoice_production_contract.source_revision == invoice_candidate_sha
          - invoice_production_contract.wheel_sha256 == invoice_approved_wheel_sha256
          - invoice_production_contract.validation_job_id | int == invoice_validation_job_id | int
          - invoice_production_guards | length == 2
          - invoice_production_guards | map(attribute='summary_fields.job.status') | unique | list == ['successful']
          - invoice_production_nodes.json.count == 4
          - invoice_production_approval | length == 1
          - invoice_production_deploy | length == 1
          - invoice_production_approval[0].summary_fields.job.type == 'workflow_approval'
          - invoice_production_approval[0].summary_fields.job.status == 'successful'
          - invoice_production_deploy[0].summary_fields.job.status == 'successful'
        fail_msg: Approval, deployment or workflow identity is missing or unsuccessful; the incident remains unresolved.
    - name: verify-deployment | Read the executed trusted release checks
      ansible.builtin.uri:
        url: '{{ invoice_review_api }}/jobs/{{ item.job }}/'
        url_username: '{{ invoice_review_username }}'
        url_password: '{{ invoice_review_password }}'
        force_basic_auth: true
        validate_certs: true
        return_content: true
      loop: '{{ invoice_production_guards }}'
      loop_control:
        label: '{{ item.identifier }}'
      register: invoice_production_guard_records
      no_log: true
      check_mode: false
    - name: verify-deployment | Require trusted checks of this exact contract on both sides of approval
      ansible.builtin.assert:
        that:
          - item.json.status == 'successful'
          - item.json.summary_fields.job_template.name == 'invoice_prepare_release'
          - item.json.summary_fields.project.name == 'demojam-ansible'
          - item.json.artifacts.invoice_release_contract == invoice_production_contract
          - item.item.identifier != 'recheck-release' or (item.json.extra_vars | from_json).invoice_require_production_approval | bool
      loop: '{{ invoice_production_guard_records.results }}'
      loop_control:
        label: '{{ item.item.identifier }}'
    - name: verify-deployment | Read the executed production job
      ansible.builtin.include_tasks: tasks/controller-read.yml
      vars:
        controller_read_path: 'jobs/{{ invoice_production_deploy[0].job }}/'
        controller_read_register: invoice_production_job
    - name: verify-deployment | Read the executed production image
      ansible.builtin.include_tasks: tasks/controller-read.yml
      vars:
        controller_read_path: 'execution_environments/{{ invoice_production_job.json.execution_environment }}/'
        controller_read_register: invoice_production_ee
    - name: verify-deployment | Require execution of the independently tested artifact and source
      ansible.builtin.assert:
        that:
          - invoice_production_job.json.status == 'successful'
          - invoice_production_ee.json.image == invoice_production_contract.execution_environment
          - invoice_production_job.json.summary_fields.job_template.name == 'invoice_deploy'
          - invoice_production_job.json.summary_fields.project.name == 'invoice-collection'
          - (invoice_production_job.json.extra_vars | from_json).invoice_release_contract == invoice_production_contract
          - invoice_production_job.json.artifacts.invoice_release_contract == invoice_production_contract
          - invoice_production_job.json.artifacts.invoice_release_manifest_sha256 == invoice_production_contract.release_manifest_sha256
          - invoice_production_job.json.scm_revision == invoice_candidate_sha
          - invoice_production_job.json.artifacts.invoice_release_evidence.passed | bool
          - invoice_production_job.json.artifacts.invoice_release_evidence.release.wheel_sha256 == invoice_approved_wheel_sha256
    - name: verify-deployment | Publish the verified production execution identity
      ansible.builtin.set_stats:
        data:
          invoice_deployment_verified: true
          invoice_deployment_job_id: "{{ invoice_production_job.json.id }}"
          invoice_production_workflow_id: "{{ invoice_deployment_workflow_id }}"
