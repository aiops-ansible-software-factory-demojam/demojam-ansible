---
- name: Require human approval and exact source deployment before verification
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vars/invoice/orchestration.yml
  tasks:
    - name: Require an exact release and workflow identity
      ansible.builtin.assert:
        that:
          - invoice_candidate_sha is match('^[0-9a-f]{40}$')
          - invoice_approved_wheel_sha256 is match('^[0-9a-f]{64}$')
          - invoice_deployment_workflow_id | int > 0
    - name: Read the actual production workflow
      ansible.builtin.uri:
        url: "{{ invoice_review_api }}/workflow_jobs/{{ invoice_deployment_workflow_id }}/"
        url_username: "{{ invoice_review_username }}"
        url_password: "{{ invoice_review_password }}"
        force_basic_auth: true
        validate_certs: true
        return_content: true
      register: invoice_production_workflow
      no_log: true
      check_mode: false
    - name: Read the approval and deployment outcomes
      ansible.builtin.uri:
        url: >-
          {{ invoice_review_api }}/workflow_jobs/{{ invoice_deployment_workflow_id }}/workflow_nodes/?page_size=20
        url_username: "{{ invoice_review_username }}"
        url_password: "{{ invoice_review_password }}"
        force_basic_auth: true
        validate_certs: true
        return_content: true
      register: invoice_production_nodes
      no_log: true
      check_mode: false
    - name: Select the protected workflow nodes
      ansible.builtin.set_fact:
        invoice_production_approval: >-
          {{ invoice_production_nodes.json.results | selectattr('identifier', 'equalto', 'production-approval')
          | list }}
        invoice_production_deploy: >-
          {{ invoice_production_nodes.json.results | selectattr('identifier', 'equalto', 'deploy') | list }}
    - name: Require successful approval and deployment in the exact release workflow
      ansible.builtin.assert:
        that:
          - invoice_production_workflow.json.status == 'successful'
          - invoice_production_workflow.json.name == 'invoice-promote-' + invoice_candidate_sha + '-' + invoice_approved_wheel_sha256
          - invoice_production_nodes.json.count == 2
          - invoice_production_approval | length == 1
          - invoice_production_deploy | length == 1
          - invoice_production_approval[0].summary_fields.job.type == 'workflow_approval'
          - invoice_production_approval[0].summary_fields.job.status == 'successful'
          - invoice_production_deploy[0].summary_fields.job.status == 'successful'
        fail_msg: Approval, deployment or workflow identity is missing or unsuccessful; the incident remains unresolved.
    - name: Read the executed production job
      ansible.builtin.uri:
        url: "{{ invoice_review_api }}/jobs/{{ invoice_production_deploy[0].job }}/"
        url_username: "{{ invoice_review_username }}"
        url_password: "{{ invoice_review_password }}"
        force_basic_auth: true
        validate_certs: true
        return_content: true
      register: invoice_production_job
      no_log: true
      check_mode: false
    - name: Require execution of the independently tested artifact and source
      ansible.builtin.assert:
        that:
          - invoice_production_job.json.status == 'successful'
          - invoice_production_job.json.scm_revision == invoice_candidate_sha
          - invoice_production_job.json.artifacts.invoice_release_evidence.passed | bool
          - invoice_production_job.json.artifacts.invoice_release_evidence.release.wheel_sha256 == invoice_approved_wheel_sha256
    - name: Publish the verified production execution identity
      ansible.builtin.set_stats:
        data:
          invoice_deployment_verified: true
          invoice_deployment_job_id: "{{ invoice_production_job.json.id }}"
          invoice_production_workflow_id: "{{ invoice_deployment_workflow_id }}"
