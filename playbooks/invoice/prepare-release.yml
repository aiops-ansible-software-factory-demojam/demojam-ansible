---
- name: Bind a reusable promotion run to trusted acceptance and human merge
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vars/invoice/orchestration.yml
  vars:
    invoice_candidate_sha: '{{ invoice_release_contract.source_revision | default("") }}'
    invoice_validation_job_id: '{{ invoice_release_contract.validation_job_id | default(0) }}'
    invoice_issue_number: '{{ invoice_release_contract.issue_number | default(0) }}'
    invoice_pr_number: '{{ invoice_release_contract.pr_number | default(0) }}'
    invoice_current_material: >-
      {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'INVOICE_MATERIAL_FILE')) | from_json }}
  tasks:
    - name: Require exact source and review identities
      ansible.builtin.assert:
        that:
          - invoice_candidate_sha is match('^[0-9a-f]{40}$')
          - invoice_validation_job_id | int > 0
          - invoice_issue_number | int > 0
          - invoice_pr_number | int > 0
    - name: Require human merge of the unchanged incident PR contained in main
      ansible.builtin.uri:
        url: >-
          http://backstage-feature-gate.automation-orchestrator.svc:8080/invoice/pr?issue_number={{ invoice_issue_number
          }}&pr_number={{ invoice_pr_number }}&head_sha={{ invoice_candidate_sha }}&require_merged=true
        return_content: true
        status_code: 200
      register: invoice_merged_pr
      check_mode: false
    - name: Refuse promotion before human merge
      ansible.builtin.assert:
        that:
          - invoice_merged_pr.json.merged | bool
          - invoice_merged_pr.json.head_sha == invoice_candidate_sha
    - name: Read independent AAP validation evidence
      ansible.builtin.uri:
        url: '{{ invoice_review_api }}/jobs/{{ invoice_validation_job_id }}/'
        url_username: '{{ invoice_review_username }}'
        url_password: '{{ invoice_review_password }}'
        force_basic_auth: true
        validate_certs: true
        return_content: true
      register: invoice_validation_record
      no_log: true
      check_mode: false
    - name: Read the execution environment used by validation
      ansible.builtin.uri:
        url: '{{ invoice_review_api }}/execution_environments/{{ invoice_validation_record.json.execution_environment }}/'
        url_username: '{{ invoice_review_username }}'
        url_password: '{{ invoice_review_password }}'
        force_basic_auth: true
        validate_certs: true
        return_content: true
      register: invoice_validation_ee
      no_log: true
      check_mode: false
    - name: Read the reusable deployment template
      ansible.builtin.uri:
        url: '{{ invoice_review_api }}/job_templates/?name=invoice_deploy&organization__name=demo'
        url_username: '{{ invoice_review_username }}'
        url_password: '{{ invoice_review_password }}'
        force_basic_auth: true
        validate_certs: true
        return_content: true
      register: invoice_deploy_template
      no_log: true
      check_mode: false
    - name: Require exactly one configured deployment template
      ansible.builtin.assert:
        that:
          - invoice_deploy_template.json.count == 1
    - name: Bind promotion to the successfully tested source material and execution image
      ansible.builtin.assert:
        that:
          - invoice_validation_record.json.status == 'successful'
          - invoice_validation_record.json.summary_fields.job_template.name == 'invoice_validate'
          - invoice_validation_record.json.summary_fields.project.name == 'demojam-ansible'
          - (invoice_validation_record.json.extra_vars | from_json).invoice_candidate_sha == invoice_candidate_sha
          - invoice_validation_record.json.artifacts.invoice_validation.passed | bool
          - invoice_validation_record.json.artifacts.invoice_validation.unit | default(false) | bool
          - invoice_validation_record.json.artifacts.invoice_validation.source_revision == invoice_candidate_sha
          - invoice_validation_record.json.artifacts.invoice_validation.acceptance_suite == 'trusted-invoice-v2'
          - invoice_validation_record.json.artifacts.invoice_validation.backend == 'aws'
          - invoice_validation_record.json.artifacts.invoice_validation.profile_sha256 == (invoice_current_material.profile
            | to_json(sort_keys=true) | hash('sha256'))
          - >-
            invoice_validation_record.json.artifacts.invoice_validation.material_sha256 ==
            ({'profile': invoice_current_material.profile, 'lightwell': invoice_current_material.lightwell,
            'signing_key_sha256': invoice_current_material.signing_key_sha256} | to_json(sort_keys=true) | hash('sha256'))
          - invoice_validation_record.json.artifacts.invoice_validation.wheel_sha256 == invoice_current_material.lightwell.sha256
          - invoice_validation_record.json.artifacts.invoice_validation.release_manifest_sha256 is match('^[0-9a-f]{64}$')
          - invoice_validation_ee.json.image is match('^.+@sha256:[0-9a-f]{64}$')
          - invoice_deploy_template.json.results[0].execution_environment == invoice_validation_record.json.execution_environment
          - invoice_deploy_template.json.results[0].ask_scm_branch_on_launch | bool
        fail_msg: Validation, material or the configured execution environment differs from the tested release.
    - name: Construct the public immutable release contract
      ansible.builtin.set_fact:
        invoice_checked_contract:
          schema_version: 1
          source_revision: '{{ invoice_candidate_sha }}'
          validation_job_id: '{{ invoice_validation_job_id | int }}'
          issue_number: '{{ invoice_issue_number | int }}'
          pr_number: '{{ invoice_pr_number | int }}'
          wheel_sha256: '{{ invoice_current_material.lightwell.sha256 }}'
          material_sha256: '{{ invoice_validation_record.json.artifacts.invoice_validation.material_sha256 }}'
          release_manifest_sha256: '{{ invoice_validation_record.json.artifacts.invoice_validation.release_manifest_sha256 }}'
          execution_environment: '{{ invoice_validation_ee.json.image }}'
    - name: Refuse a changed contract during the approval wait
      ansible.builtin.assert:
        that: invoice_release_contract == invoice_checked_contract
      when: invoice_release_contract is defined
    - name: Verify workflow launch identity and human approval immediately before deployment
      ansible.builtin.include_tasks: tasks/approval-proof.yml
      when: invoice_require_production_approval | default(false) | bool
    - name: Expose the checked contract for this workflow execution
      ansible.builtin.set_stats:
        aggregate: false
        data:
          invoice_release_contract: '{{ invoice_checked_contract }}'
