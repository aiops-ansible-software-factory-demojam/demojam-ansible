---
- name: fault-prepare | Install the previous application release on both acceptance guests
  hosts: molecule
  become: true
  gather_facts: true
  vars:
    invoice_collection_directory: "{{ lookup('ansible.builtin.env', 'REMEDIATION_CANDIDATE_PLAYBOOK') | dirname | dirname }}"
    invoice_release_channel: baseline
    invoice_execution_revision: "{{ lookup('ansible.builtin.env', 'INVOICE_SOURCE_COMMIT') }}"
  tasks:
    - name: fault-prepare | Install the previous release using the shared deployment contract
      ansible.builtin.include_role:
        name: demo.pythonapp.python_application
        vars_from: invoice
      vars:
        # Resolve assets from the reviewed candidate, even when the role's
        # installed location or this acceptance playbook lives elsewhere.
        python_application_source: >-
          {{ lookup('ansible.builtin.env', 'REMEDIATION_CANDIDATE_PLAYBOOK') | dirname }}/../roles/invoice/files/invoice/
    - name: fault-prepare | Create a canary-only systemd override directory
      when: inventory_hostname == groups['molecule'][0]
      ansible.builtin.file:
        path: /etc/systemd/system/invoice-portal.service.d
        state: directory
        mode: '0755'
    - name: fault-prepare | Inject a real activation failure on the first disposable guest
      when: inventory_hostname == groups['molecule'][0]
      ansible.builtin.copy:
        dest: /etc/systemd/system/invoice-portal.service.d/acceptance-fault.conf
        mode: '0644'
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/false
          Restart=no
    - name: fault-prepare | Stop the canary before testing candidate activation
      when: inventory_hostname == groups['molecule'][0]
      ansible.builtin.systemd_service:
        name: invoice-portal
        daemon_reload: true
        state: stopped
  vars_files:
    - >-
      {{ lookup('ansible.builtin.env', 'REMEDIATION_CANDIDATE_PLAYBOOK') | dirname }}/../roles/invoice/vars/main.yml
