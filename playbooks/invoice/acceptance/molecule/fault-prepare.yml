---
- name: Install the previous application release on both acceptance guests
  hosts: molecule
  become: true
  gather_facts: true
  vars:
    invoice_material: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'INVOICE_MATERIAL_FILE')) | from_json }}"
    invoice_release_channel: baseline
    invoice_portal_artifact: '{{ invoice_material.baseline }}'
    invoice_portal_expected: "{{ invoice_material.profile.validation.baseline_expectation | default('remediated') }}"
    invoice_portal_source_revision: "{{ lookup('ansible.builtin.env', 'INVOICE_SOURCE_COMMIT') }}"
    invoice_portal_repository_username: '{{ invoice_material.repository_username }}'
    invoice_portal_repository_token: '{{ invoice_material.repository_token }}'
    invoice_portal_signing_key: "{{ lookup('ansible.builtin.env', 'INVOICE_SIGNING_KEY_FILE') }}"
    invoice_portal_signing_key_sha256: '{{ invoice_material.signing_key_sha256 }}'
  roles:
    - demo.pythonapp.invoice_portal
  tasks:
    - name: Create a canary-only systemd override directory
      when: inventory_hostname == groups['molecule'][0]
      ansible.builtin.file:
        path: /etc/systemd/system/invoice-portal.service.d
        state: directory
        mode: '0755'

    - name: Inject a real activation failure on the first disposable guest
      when: inventory_hostname == groups['molecule'][0]
      ansible.builtin.copy:
        dest: /etc/systemd/system/invoice-portal.service.d/acceptance-fault.conf
        mode: '0644'
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/false
          Restart=no

    - name: Stop the canary before testing candidate activation
      when: inventory_hostname == groups['molecule'][0]
      ansible.builtin.systemd_service:
        name: invoice-portal
        daemon_reload: true
        state: stopped
