---
- name: Verify the RHEL acceptance matrix
  ansible.builtin.import_playbook: ../utils/playbooks/verify.yml

- name: Verify installed artifacts and application behavior using trusted policy
  hosts: molecule
  become: true
  gather_facts: false
  vars:
    acceptance_material: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'INVOICE_MATERIAL_FILE')) | from_json }}"
    acceptance_profile: '{{ acceptance_material.profile }}'
    acceptance_artifact: '{{ acceptance_material.lightwell }}'
  tasks:
    - name: Read the running release
      ansible.builtin.uri:
        url: http://127.0.0.1/api/status
        return_content: true
      register: acceptance_status

    - name: Require the approved package version artifact and reviewed source
      ansible.builtin.assert:
        that:
          - acceptance_status.json.installed.package | lower == acceptance_artifact.package | lower
          - acceptance_status.json.installed.version == acceptance_artifact.version
          - acceptance_status.json.release.wheel_sha256 == acceptance_artifact.sha256
          - acceptance_status.json.release.source_revision == lookup('ansible.builtin.env', 'INVOICE_SOURCE_COMMIT')
          - acceptance_status.json.timeout_seconds == 2

    - name: Hash the actual installed wheel on disk
      ansible.builtin.stat:
        path: '/opt/invoice-portal/current/{{ acceptance_artifact.filename }}'
        checksum_algorithm: sha256
      register: acceptance_wheel

    - name: Require the wheel bytes to match independent approval
      ansible.builtin.assert:
        that: acceptance_wheel.stat.checksum == acceptance_artifact.sha256

    - name: Run the mandatory application business checks
      ansible.builtin.uri:
        url: 'http://127.0.0.1{{ item.path }}'
        method: '{{ item.method | default("GET") }}'
        return_content: true
      loop: '{{ acceptance_profile.validation.business_checks }}'
      register: acceptance_business

    - name: Require the expected business results
      ansible.builtin.assert:
        that:
          - item.json.status == item.item.status
          - item.item.text_contains | default('') in item.json.text | default('')
      loop: '{{ acceptance_business.results }}'
      loop_control:
        label: '{{ item.item.path }}'

    - name: Exercise the optional mandatory regression
      when: acceptance_profile.validation.regression is defined
      ansible.builtin.uri:
        url: 'http://127.0.0.1{{ acceptance_profile.validation.regression.path }}'
        method: '{{ acceptance_profile.validation.regression.method | default("POST") }}'
        return_content: true
        timeout: 15
      register: acceptance_regression

    - name: Require successful regression processing
      when: acceptance_profile.validation.regression is defined
      ansible.builtin.assert:
        that:
          - acceptance_regression.json.status == acceptance_profile.validation.regression.remediated_status
          - acceptance_profile.validation.regression.text_contains | default('') in acceptance_regression.json.text | default('')

    - name: Copy independent invoice acceptance inputs
      ansible.builtin.copy:
        src: files/
        dest: /var/tmp/invoice-acceptance/
        mode: '0644'
        directory_mode: '0755'

    - name: Process independently supplied normal and regression documents
      ansible.builtin.command:
        argv: [/usr/bin/python3.12, /var/tmp/invoice-acceptance/invoice_probe.py]
      changed_when: false

    - name: Read package metadata from the actual deployed Python environment
      ansible.builtin.command:
        argv:
          - /opt/invoice-portal/current/venv/bin/python
          - -c
          - "import importlib.metadata,sys; print(importlib.metadata.version(sys.argv[1]))"
          - '{{ acceptance_artifact.package }}'
      register: acceptance_installed
      changed_when: false
      failed_when: acceptance_installed.stdout | trim != acceptance_artifact.version

    - name: Require enforced SELinux
      ansible.builtin.command: getenforce
      register: acceptance_selinux
      changed_when: false
      failed_when: acceptance_selinux.stdout | trim != 'Enforcing'
