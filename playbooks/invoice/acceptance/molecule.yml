---
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=../utils/inventory/base/
        - --inventory=../utils/inventory/aws/
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
  playbooks:
    create: ../utils/playbooks/create.yml
    destroy: ../utils/playbooks/destroy.yml
    prepare: ../utils/playbooks/prepare.yml
    converge: converge.yml
    verify: verify.yml
scenario:
  # Use the provisioner's ownership records to clean up before any new guest.
  create_sequence:
    - destroy
    - create
    - prepare
  converge_sequence:
    - destroy
    - create
    - prepare
    - converge
  check_sequence:
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  test_sequence:
    - syntax
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
