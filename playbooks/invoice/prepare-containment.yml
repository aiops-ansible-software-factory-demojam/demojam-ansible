---
- name: Validate temporary application containment before and after approval
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vars/invoice/orchestration.yml
  vars:
    invoice_response_material: '{{ lookup("ansible.builtin.file", lookup("ansible.builtin.env", "INVOICE_MATERIAL_FILE")) | from_json }}'
  tasks:
    - name: Read the independent routing decision and assessment
      ansible.builtin.import_tasks: tasks/read-response.yml
    - name: Require the saved containment request to match trusted policy and observations
      ansible.builtin.assert:
        that:
          - invoice_response == invoice_trusted_response
          - invoice_trusted_response.route == 'contain'
          - invoice_trusted_response.affected | bool
          - invoice_response_material.profile.response.containment == 'stop_service'
          - invoice_trusted_response.cvss_score | float >= invoice_response_material.profile.response.high_severity_threshold | default(7.0) | float
          - invoice_response_material.profile.application.inventory_group == 'pythonapps'
          - invoice_response_material.profile.application.service is match('^[A-Za-z0-9_-]+$')
          - invoice_routing_finding.observations | map(attribute='assessment_state') | difference(['affected', 'fixed']) | length == 0
    - name: Prove this exact native workflow approval before containment
      when: invoice_require_containment_approval | default(false) | bool
      ansible.builtin.include_tasks: tasks/containment-approval.yml
    - name: Publish the checked containment request
      ansible.builtin.set_stats:
        aggregate: false
        data:
          invoice_response: '{{ invoice_trusted_response }}'
          invoice_findings: '{{ invoice_routing_finding }}'
