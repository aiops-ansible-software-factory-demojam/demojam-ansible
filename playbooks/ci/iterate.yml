---
- name: Advance one source-bound CI attempt and return unfinished work to its author
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ci_controller: '{{ lookup("ansible.builtin.env", "AAP_HOST") }}/api/controller/v2'
    ci_username: '{{ lookup("ansible.builtin.env", "AAP_USERNAME") }}'
    ci_password: '{{ lookup("ansible.builtin.env", "AAP_PASSWORD") }}'
    ci_web: '{{ ci_repository == "demo-owner/ansible-collection-demo.webapp" }}'
    ci_prefix: '{{ "webapp" if ci_web else "invoice" }}'
    ci_gate: 'http://backstage-feature-gate.automation-orchestrator.svc:8080/{{ ci_prefix }}/candidate?issue_number={{ ci_issue_number }}'
    ci_agent_api: http://omnigent.omnigent.svc:8000
  tasks:
    - name: Require a supported incident and its existing author session
      ansible.builtin.assert:
        that:
          - ci_repository in ['demo-owner/ansible-collection-demo.webapp', 'demo-owner/ansible-collection-demo.pythonapp']
          - ci_issue_number | int > 0
          - ci_author_session is match('^[a-zA-Z0-9-]{16,64}$')
    - name: Independently read the current published head and CI status
      ansible.builtin.uri:
        url: '{{ ci_gate }}'
      register: ci_candidate
    - name: Validate a new published source revision
      when: ci_candidate.json.validation_required | bool
      block:
        - name: Construct the exact published candidate identity
          ansible.builtin.set_fact:
            ci_identity:
              ci_repository: '{{ ci_repository }}'
              ci_candidate_sha: '{{ ci_candidate.json.head_sha }}'
              ci_pr_number: '{{ ci_candidate.json.number }}'
        - name: Publish a pending independent check before tests
          ansible.builtin.include_tasks: run-job.yml
          vars:
            ci_child_template: demo_ci_publish
            ci_child_vars: '{{ ci_identity | combine({"ci_pending": true}) }}'
        - name: Require the pending check to be published
          ansible.builtin.assert:
            that: ci_child.json.status == 'successful'
        - name: Run the exact source in the independent validator with test credentials only
          ansible.builtin.include_tasks: run-job.yml
          vars:
            ci_child_template: '{{ "webapp_validate" if ci_web else "invoice_validate" }}'
            ci_child_vars: >-
              {{ {'webapp_candidate_sha': ci_candidate.json.head_sha, 'webapp_base_sha': ci_candidate.json.base_sha}
              if ci_web else {'invoice_candidate_sha': ci_candidate.json.head_sha} }}
        - name: Retain the actual independent validation job identity
          ansible.builtin.set_fact:
            ci_test_job_id: '{{ ci_child.json.id }}'
        - name: Publish success or failure from the independent job and sanitized diagnostics
          ansible.builtin.include_tasks: run-job.yml
          vars:
            ci_child_template: demo_ci_publish
            ci_child_vars: '{{ ci_identity | combine({"ci_validation_job_id": ci_test_job_id}) }}'
        - name: Require successful publication and cleanup before author repair
          ansible.builtin.assert:
            that: ci_child.json.status == 'successful'
    - name: Recheck the latest head after any completed tests
      ansible.builtin.uri:
        url: '{{ ci_gate }}'
      register: ci_latest
    - name: Return failed CI to the existing author without interrupting active work
      when: ci_latest.json.ci_failed | bool
      block:
        - name: Authenticate for an author feedback callback
          ansible.builtin.uri:
            url: '{{ ci_agent_api }}/oauth/token'
            method: POST
            url_username: '{{ lookup("ansible.builtin.env", "OMNIGENT_CI_CLIENT_ID") }}'
            url_password: '{{ lookup("ansible.builtin.env", "OMNIGENT_CI_CLIENT_SECRET") }}'
            force_basic_auth: true
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
          register: ci_agent_auth
          no_log: true
        - name: Read the existing author activity before sending feedback
          ansible.builtin.uri:
            url: '{{ ci_agent_api }}/v1/sessions/{{ ci_author_session }}'
            headers:
              Authorization: 'Bearer {{ ci_agent_auth.json.access_token }}'
          register: ci_author
          no_log: true
        - name: Bind the callback to this incident and author
          ansible.builtin.assert:
            that:
              - ci_author.json.id == ci_author_session
              - ci_author.json.agent_name == 'automation-developer'
              - ci_author.json.title == ('Webapp outage issue ' if ci_web else 'Invoice remediation issue ') ~ (ci_issue_number | string)
        - name: Identify source-bound feedback already delivered to this author
          ansible.builtin.set_fact:
            ci_feedback_marker: '<!-- demo-ci-feedback sha={{ ci_latest.json.head_sha }} -->'
        - name: Deliver failure feedback once per source revision regardless of author activity
          when: >-
            ci_author.json.status in ['idle', 'running'] and
            ci_feedback_marker not in (ci_author.json['items'] | default([]) | to_json)
          ansible.builtin.uri:
            url: '{{ ci_agent_api }}/v1/sessions/{{ ci_author_session }}/events'
            method: POST
            status_code: 202
            headers:
              Authorization: 'Bearer {{ ci_agent_auth.json.access_token }}'
            body_format: json
            body:
              type: message
              data:
                role: user
                content:
                  - type: input_text
                    text: >-
                      {{ ci_feedback_marker }} Independent CI failed for {{ ci_latest.json.head_sha }} on your existing incident PR.
                      Continue this same task, branch and PR. Run demo-goldenpath --repository {{ ci_repository }}
                      ci {{ ci_issue_number }} --wait and read the trusted reviewer diagnostics. Fix the cause,
                      rerun local checks after your final edit, commit and push, then wait for all independent
                      CI on the new SHA. Exit 75 means pending, not completion. Do not weaken tests, forge a
                      status, merge, deploy, change production, or claim success before the current head is green.
          no_log: true
    - name: Return logical completion only for the latest independently green commit
      ansible.builtin.set_stats:
        data:
          ci_iteration:
            passed: '{{ ci_latest.json.ci_passed }}'
            source_revision: '{{ ci_latest.json.head_sha }}'
            pr_number: '{{ ci_latest.json.number }}'
