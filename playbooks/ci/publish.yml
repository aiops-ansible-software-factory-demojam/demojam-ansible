---
- name: Publish trusted CI evidence separately from candidate execution
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ci_is_webapp: '{{ ci_repository == "demo-owner/ansible-collection-demo.webapp" }}'
    ci_expected_template: '{{ "webapp_validate" if ci_is_webapp else "invoice_validate" }}'
    ci_context: '{{ "webapp/regression-validation" if ci_is_webapp else "invoice/ec2-validation" }}'
    ci_prefix: '{{ "webapp-ci-v2" if ci_is_webapp else "invoice-ci-v2" }}'
    ci_api: '{{ lookup("ansible.builtin.env", "FORGEJO_URL") }}/api/v1/repos/{{ ci_repository }}'
    ci_aap_api: '{{ lookup("ansible.builtin.env", "AAP_HOST") }}/api/controller/v2'
  tasks:
    - name: Require a bounded application and exact published identity
      ansible.builtin.assert:
        that:
          - ci_repository in ['demo-owner/ansible-collection-demo.webapp', 'demo-owner/ansible-collection-demo.pythonapp']
          - ci_candidate_sha is match('^[0-9a-f]{40}$')
          - ci_pr_number | int > 0
    - name: Read the exact candidate PR before publishing any check
      ansible.builtin.uri:
        url: '{{ ci_api }}/pulls/{{ ci_pr_number }}'
        headers:
          Authorization: 'token {{ lookup("ansible.builtin.env", "FORGEJO_TOKEN") }}'
          Sudo: demo-reviewer
      register: ci_pr
      no_log: true
    - name: Reject a changed or closed PR
      ansible.builtin.assert:
        that:
          - ci_pr.json.state == 'open'
          - ci_pr.json.base.ref == 'main'
          - ci_pr.json.head.repo.full_name == ci_repository
          - ci_pr.json.base.repo.full_name == ci_repository
    - name: Bind the result to an independent Controller job
      when: not (ci_pending | default(false) | bool)
      block:
        - name: Read the trusted validation job
          ansible.builtin.uri:
            url: '{{ ci_aap_api }}/jobs/{{ ci_validation_job_id | int }}/'
            url_username: '{{ lookup("ansible.builtin.env", "AAP_USERNAME") }}'
            url_password: '{{ lookup("ansible.builtin.env", "AAP_PASSWORD") }}'
            force_basic_auth: true
            validate_certs: true
          register: ci_job
          no_log: true
        - name: Require the trusted project and validator for this exact source
          ansible.builtin.assert:
            that:
              - ci_job.json.summary_fields.project.name == 'demojam-ansible'
              - ci_job.json.summary_fields.job_template.name == ci_expected_template
              - ci_job.json.status in ['successful', 'failed', 'error', 'canceled']
              - (ci_job.json.extra_vars | from_json)[('webapp' if ci_is_webapp else 'invoice') ~ '_candidate_sha'] == ci_candidate_sha
        - name: Select the independent evidence and bounded failure report
          ansible.builtin.set_fact:
            ci_proof: '{{ ci_job.json.artifacts.ci_validation | default({}) if ci_is_webapp else ci_job.json.artifacts.invoice_validation | default({}) }}'
            ci_feedback: '{{ ci_job.json.artifacts.ci_validation.feedback | default("CI did not produce diagnostics; inspect the independent AAP job.") }}'
            ci_cleanup_required: '{{ ci_job.json.artifacts.ci_validation.cleanup_required | default(false) | bool }}'
        - name: Derive success only from completed source-bound acceptance
          ansible.builtin.set_fact:
            ci_passed: >-
              {{ ci_job.json.status == 'successful' and ci_proof.passed | default(false) | bool
              and ci_proof.source_revision | default('') == ci_candidate_sha
              and ((ci_proof.suite | default('') == 'webapp-ci-v2'
              and ci_proof.lint | default(false) | bool and ci_proof.build | default(false) | bool
              and ci_proof.unit | default(false) | bool and ci_proof.molecule | default(false) | bool
              and ci_proof.base_revision | default('') == ci_pr.json.merge_base
              and ci_proof.red | default(false) | bool and ci_proof.green | default(false) | bool
              and ci_proof.durable | default(false) | bool)
              if ci_is_webapp else (ci_proof.acceptance_suite | default('') == 'trusted-invoice-v2'
              and ci_proof.backend | default('') == 'aws' and ci_proof.unit | default(false) | bool)) }}
        - name: Describe completed acceptance without a failure diagnostic
          when: ci_passed | bool
          ansible.builtin.set_fact:
            ci_feedback: Independent lint, collection build and all required machine acceptance checks passed for this exact commit.
    # Only this job receives the reviewer token. Neither validation job nor its
    # candidate subprocesses receive it or the Controller API credential.
    - name: Publish the independent status for this exact commit
      ansible.builtin.uri:
        url: '{{ ci_api }}/statuses/{{ ci_candidate_sha }}'
        method: POST
        headers:
          Authorization: 'token {{ lookup("ansible.builtin.env", "FORGEJO_TOKEN") }}'
          Sudo: demo-reviewer
        body_format: json
        body:
          context: '{{ ci_context }}'
          state: '{{ "pending" if ci_pending | default(false) | bool else ("success" if ci_passed | bool else "failure") }}'
          description: >-
            {{ ci_prefix ~ ' pending' if ci_pending | default(false) | bool else
            ('webapp-ci-v2 base=' ~ ci_pr.json.merge_base ~ ' checks=passed red=passed green=passed durable=passed'
            if ci_is_webapp and ci_passed | bool else
            (ci_prefix ~ ' checks=passed' if ci_passed | bool else ci_prefix ~ ' failed; read PR diagnostics')) }}
          target_url: >-
            {{ '' if ci_pending | default(false) | bool else lookup('ansible.builtin.env', 'AAP_HOST')
            ~ '/execution/jobs/playbook/' ~ (ci_validation_job_id | string) ~ '/output' }}
        status_code: 201
      register: ci_status
      no_log: true
    - name: Require the independent publisher identity
      ansible.builtin.assert:
        that: ci_status.json.creator.login == 'demo-reviewer'
    - name: Publish source-bound diagnostics that the author can read without AAP credentials
      when: not (ci_pending | default(false) | bool)
      ansible.builtin.uri:
        url: '{{ ci_api }}/issues/{{ ci_pr_number }}/comments'
        method: POST
        headers:
          Authorization: 'token {{ lookup("ansible.builtin.env", "FORGEJO_TOKEN") }}'
          Sudo: demo-reviewer
        body_format: json
        body:
          body: |-
            <!-- demo-ci sha={{ ci_candidate_sha }} -->
            Independent CI {{ 'passed' if ci_passed | bool else 'failed' }} for `{{ ci_candidate_sha }}`.
            {{ ci_feedback }}
            {{ 'Ready for human review; do not deploy.' if ci_passed | bool else
            'Fix the failure on this same PR, rerun local checks, commit and push, then wait for independent CI on the new SHA.' }}
        status_code: 201
      no_log: true
    - name: Expose the trusted verdict to the orchestration loop
      when: not (ci_pending | default(false) | bool)
      ansible.builtin.set_stats:
        data:
          ci_result:
            passed: '{{ ci_passed }}'
            source_revision: '{{ ci_candidate_sha }}'
            feedback: '{{ ci_feedback }}'
            superseded: '{{ ci_pr.json.head.sha != ci_candidate_sha }}'
    - name: Require operator cleanup before starting another machine test
      when: not (ci_pending | default(false) | bool)
      ansible.builtin.assert:
        that: not ci_cleanup_required | bool
        fail_msg: Independent CI cleanup failed; its check remains unsuccessful. Resolve owned resources before retrying.
