---
- name: Independently validate the exact published nginx commit
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require exact original and candidate source identities
      ansible.builtin.assert:
        that:
          - webapp_candidate_sha is match('^[0-9a-f]{40}$')
          - webapp_base_sha is match('^[0-9a-f]{40}$')
          - webapp_candidate_sha != webapp_base_sha
    - name: Allocate an independent validation workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: webapp-ci-
      register: ci_directory
    - name: Read the operator-selected disposable test environment
      ansible.builtin.set_fact:
        ci_environment: >-
          {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'DEMO_CI_PROFILE_FILE')) | from_json
          | combine({'ANSIBLE_COLLECTIONS_PATH': ci_directory.path ~ '/installed:/usr/share/ansible/collections'}) }}
    - name: Validate candidate automation and regression coverage
      block:
        - name: Fetch the exact published collection commit
          ansible.builtin.git:
            repo: http://forgejo.forgejo.svc.cluster.local:3000/demo-owner/ansible-collection-demo.webapp.git
            dest: '{{ ci_directory.path }}/source'
            version: '{{ webapp_candidate_sha }}'
          register: ci_checkout
        - name: Require the exact published checkout
          ansible.builtin.assert:
            that: ci_checkout.after == webapp_candidate_sha
        - name: Install declared production dependencies in the isolated test root
          ansible.builtin.command:
            argv: [ansible-galaxy, collection, install, -r, collections/requirements.yml, -p, '{{ ci_directory.path }}/installed']
            chdir: '{{ ci_directory.path }}/source'
          environment: '{{ ci_environment }}'
          changed_when: false
        - name: Build the exact published collection
          ansible.builtin.command:
            argv: [ansible-galaxy, collection, build, --force, --output-path, '{{ ci_directory.path }}']
            chdir: '{{ ci_directory.path }}/source'
          environment: '{{ ci_environment }}'
          changed_when: false
        - name: Locate the exact built candidate
          ansible.builtin.find:
            paths: '{{ ci_directory.path }}'
            patterns: demo-webapp-*.tar.gz
          register: ci_built
        - name: Require one candidate artifact
          ansible.builtin.assert:
            that: ci_built.matched == 1
        - name: Install the built candidate separately from its source
          ansible.builtin.command:
            argv: [ansible-galaxy, collection, install, '{{ ci_built.files[0].path }}', --force, --no-deps, -p, '{{ ci_directory.path }}/installed']
          environment: '{{ ci_environment }}'
          changed_when: false
        - name: Isolate lint from Controller and disposable-machine inventories
          ansible.builtin.copy:
            dest: '{{ ci_directory.path }}/lint-inventory.yml'
            mode: '0600'
            content: |
              ---
              all:
                hosts:
                  localhost:
                    ansible_connection: local
        - name: Lint production playbooks and the authored regression scenario
          ansible.builtin.command:
            argv: [ansible-lint, roles/nginx, playbooks, extensions/molecule/nginx]
            chdir: '{{ ci_directory.path }}/source'
          environment: '{{ ci_environment | combine({"ANSIBLE_INVENTORY": ci_directory.path ~ "/lint-inventory.yml"}) }}'
          changed_when: false
        - name: Run all collection unit tests
          ansible.builtin.command:
            argv: ['{{ ansible_playbook_python }}', -m, unittest, discover, -s, tests, -v]
            chdir: '{{ ci_directory.path }}/source'
          environment: '{{ ci_environment }}'
          changed_when: false
        - name: Exercise all authored Molecule scenarios
          ansible.builtin.command:
            argv: [make, molecule]
            chdir: '{{ ci_directory.path }}/source'
          environment: '{{ ci_environment }}'
          changed_when: false
        - name: Independently prove original failure and durable repaired behavior
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - -i
              - localhost,
              - '{{ playbook_dir }}/../webapp/validate-regression.yml'
              - -e
              - '{{ {"webapp_source_directory": ci_directory.path ~ "/source", "webapp_candidate_sha": webapp_candidate_sha,
                "webapp_base_sha": webapp_base_sha, "webapp_validation_receipt_destination": ci_directory.path ~ "/receipt.json"} | to_json }}'
          environment: '{{ ci_environment }}'
          changed_when: false
        - name: Read the independently produced regression receipt
          ansible.builtin.set_fact:
            ci_regression: '{{ lookup("ansible.builtin.file", ci_directory.path ~ "/receipt.json") | from_json }}'
        - name: Publish independently verified exact source evidence
          ansible.builtin.set_stats:
            data:
              ci_validation: >-
                {{ ci_regression | combine({'repository': 'demo-owner/ansible-collection-demo.webapp',
                'suite': 'webapp-ci-v2', 'lint': true, 'build': true, 'unit': true, 'molecule': true,
                'feedback': 'Lint, build, every Molecule scenario, red/green and durable relabel checks passed.'}) }}
      rescue:
        - name: Sanitize the failed stage before publishing feedback
          ansible.builtin.command:
            argv: ['{{ ansible_playbook_python }}', '{{ playbook_dir }}/feedback.py']
            stdin: '{{ ansible_failed_result | combine({"stage": ansible_failed_task.name}) | to_json }}'
          register: ci_feedback
          changed_when: false
          no_log: true
        - name: Destroy any authored disposable resources after failure
          ansible.builtin.command:
            argv: [make, destroy]
            chdir: '{{ ci_directory.path }}/source'
          environment: '{{ ci_environment }}'
          register: ci_cleanup
          failed_when: false
          changed_when: false
        - name: Publish a failed exact-source verdict and useful diagnostics
          ansible.builtin.set_stats:
            data:
              ci_validation:
                passed: false
                repository: demo-owner/ansible-collection-demo.webapp
                source_revision: '{{ webapp_candidate_sha }}'
                base_revision: '{{ webapp_base_sha }}'
                feedback: '{{ ci_feedback.stdout }}'
                cleanup_required: '{{ ci_cleanup.rc != 0 }}'
        - name: Preserve the failed independent test result
          ansible.builtin.fail:
            msg: '{{ ci_feedback.stdout }}'
      always:
        - name: Remove source and installed test artifacts after successful cleanup
          when: not (ci_cleanup.rc | default(0) != 0)
          ansible.builtin.file:
            path: '{{ ci_directory.path }}'
            state: absent
