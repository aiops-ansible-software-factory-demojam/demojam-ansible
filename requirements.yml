---
collections:
  - name: ansible.posix
    version: 2.2.2
    source: https://galaxy.ansible.com
  # Controller sync isolates its collection cache from the image's collection path.
  # Copy the supported image's dependencies instead of resolving them from Galaxy.
  - name: /usr/share/ansible/collections/ansible_collections/ansible/controller
    type: dir
  - name: /usr/share/ansible/collections/ansible_collections/ansible/platform
    type: dir
  - name: /usr/share/ansible/collections/ansible_collections/ansible/hub
    type: dir
  - name: /usr/share/ansible/collections/ansible_collections/ansible/eda
    type: dir
  - name: /usr/share/ansible/collections/ansible_collections/amazon/aws
    type: dir
  - name: infra.aap_configuration
    version: 4.8.0
    source: https://galaxy.ansible.com
  - name: https://github.com/aiops-ansible-software-factory-demojam/ansible-collection-demo.webapp.git
    type: git
    version: main
  - name: https://github.com/aiops-ansible-software-factory-demojam/ansible-collection-demo.pythonapp.git
    type: git
    version: main
