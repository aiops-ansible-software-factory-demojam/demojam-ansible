---
ansible_python_interpreter: "{{ ansible_playbook_python }}"
vm_namespace: automation-vms
vm_name: automation-demo
vm_state: present
vm_wait_timeout: 600
vm_cpus: 1
vm_memory: 512Mi
# Fast disposable default; select datasource for a persistent OS disk.
vm_disk_source: containerdisk
vm_container_image: quay.io/kubevirt/cirros-container-disk-demo:latest
vm_datasource_name: fedora
vm_datasource_namespace: openshift-virtualization-os-images
vm_disk_size: 20Gi
vm_user_data: |
  #cloud-config
  ssh_pwauth: false
