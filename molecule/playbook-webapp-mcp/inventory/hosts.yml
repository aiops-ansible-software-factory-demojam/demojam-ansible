---
all:
  children:
    molecule:
      vars:
        ansible_group_priority: 20
      hosts:
        webapp-mcp-test:
          mp:
            qemu:
              image: https://download.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base-9.8-20260525.0.x86_64.qcow2
              image_checksum: sha256:92c206cc6f790c61583247eefe87890f8828420662c17cacf247cec78ab4eec8
              cpus: 2
              memory: 2048
              disk_size: 20G
              ssh_user: cloud-user
            podman:
              image: docker.io/geerlingguy/docker-rockylinux9-ansible@sha256:6bd474577bf6d649d2db3142b7a8daaa288f677006e7532cd1ca0d3ae8d414ab
              command: /sbin/init
              privileged: true
              systemd: always
              cgroupns: private
              tty: true
              volumes:
                - /sys/fs/cgroup:/sys/fs/cgroup:rw
              env:
                SYSTEMD_LOG_TARGET: console
                SYSTEMD_LOG_LEVEL: debug
    webapps:
      hosts:
        webapp-mcp-test:
