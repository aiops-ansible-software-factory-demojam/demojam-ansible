---
- name: Prepare the provisioned guest
  ansible.builtin.import_playbook: david_igou.molecule_provisioners.prepare

- name: Prepare nginx and TLS test material
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Require production setup to supply the firewall dependency
      ansible.builtin.package:
        name: [firewalld, python3-firewall]
        state: absent
    - name: Install the guest fixture services
      ansible.builtin.package:
        name: [nginx, openssl, logrotate]
        state: present
    - name: Start the fixture services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [nginx]
    - name: Read the fixture guest clock
      ansible.builtin.command:
        argv: [date, '+%s']
      register: mcp_fixture_epoch
      changed_when: false
    - name: Prepare the isolated audit fixture directory
      ansible.builtin.file:
        path: /var/log/audit
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Add a synthetic nginx denial only in the disposable test guest
      ansible.builtin.lineinfile:
        path: /var/log/audit/audit.log
        create: true
        owner: root
        group: root
        mode: '0600'
        line: >-
          type=AVC msg=audit({{ mcp_fixture_epoch.stdout }}.123:4242): avc: denied { read } for
          comm="nginx" name="molecule-audit-fixture" scontext=system_u:system_r:httpd_t:s0
          tcontext=unconfined_u:object_r:default_t:s0 tclass=file permissive=0
    - name: Create a localhost certificate for the HTTPS test
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -days
          - '1'
          - -subj
          - /CN=localhost
          - -addext
          - subjectAltName=DNS:localhost
          - -keyout
          - /tmp/mcp-test.key
          - -out
          - /tmp/mcp-test.crt
        creates: /tmp/mcp-test.crt
      no_log: true
    - name: Read the fixture certificate
      ansible.builtin.slurp:
        src: /tmp/mcp-test.crt
      register: mcp_fixture_certificate
    - name: Read the fixture private key
      ansible.builtin.slurp:
        src: /tmp/mcp-test.key
      register: mcp_fixture_key
      no_log: true
    - name: Save test-only material for the production inventory interface
      ansible.builtin.copy:
        dest: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/mcp-material.json"
        content: >-
          {{ {'token_sha256': 'molecule-diagnostics-token' | hash('sha256'),
              'expires_at': 2000000000,
              'tls_cert': mcp_fixture_certificate.content | b64decode,
              'tls_key': mcp_fixture_key.content | b64decode,
              'ca_cert': mcp_fixture_certificate.content | b64decode} | to_json }}
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true
