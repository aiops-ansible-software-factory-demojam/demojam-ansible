---
prerun: false
dependency:
  name: galaxy
  options:
    role-file: molecule/playbook-webapp-mcp/collections.yml
    requirements-file: molecule/playbook-webapp-mcp/collections.yml
ansible:
  env:
    WEBAPP_MCP_MATERIAL_FILE: ${MOLECULE_EPHEMERAL_DIRECTORY}/mcp-material.json
  cfg:
    defaults:
      collections_path: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_PROJECT_DIRECTORY}/inventory/hosts.yml
        - --inventory=${MOLECULE_PROJECT_DIRECTORY}/molecule/playbook-webapp-mcp/inventory/
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
  playbooks:
    create: create.yml
    destroy: destroy.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
scenario:
  name: playbook-webapp-mcp
  # Every separate provisioning command starts from new, owned test guests.
  # Idempotence remains a second converge inside the same fresh test lifecycle.
  create_sequence:
    - dependency
    - destroy
    - create
    - prepare
  converge_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
  check_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  test_sequence:
    - dependency
    - syntax
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
