---
invoice_release_controller_projects:
  - name: "invoice-reviewed-{{ invoice_candidate_sha[:12] }}"
    organization: demo
    scm_type: git
    scm_url: "{{ invoice_factory_source }}"
    scm_branch: "{{ invoice_candidate_sha }}"
    allow_override: false
    scm_clean: true
    scm_update_on_launch: false
    wait: true
invoice_release_controller_credentials:
  - name: >-
      invoice-release-{{ invoice_candidate_sha }}-{{ invoice_factory_material.lightwell.sha256 }}
    organization: demo
    credential_type: Demo Invoice Artifacts
    inputs:
      material: "{{ invoice_factory_material | to_json }}"
      signing_key: "{{ invoice_factory_public_key }}"
invoice_release_controller_templates:
  - name: >-
      invoice-deploy-{{ invoice_candidate_sha }}-{{ invoice_factory_material.lightwell.sha256 }}
    organization: demo
    project: "invoice-reviewed-{{ invoice_candidate_sha[:12] }}"
    inventory: demo-inventory
    execution_environment: "{{ invoice_factory_ee_name }}"
    playbook: playbooks/invoice-remediate.yml
    credentials:
      - demo-pythonapp-ssh
      - >-
        invoice-release-{{ invoice_candidate_sha }}-{{ invoice_factory_material.lightwell.sha256 }}
    become_enabled: true
    ask_scm_branch_on_launch: false
    ask_variables_on_launch: false
    allow_simultaneous: false
    extra_vars:
      invoice_candidate_sha: "{{ invoice_candidate_sha }}"
      invoice_release_channel: lightwell
      invoice_target_group: "{{ invoice_factory_material.profile.application.inventory_group }}"
      invoice_approved_wheel_sha256: "{{ invoice_factory_material.lightwell.sha256 }}"
invoice_release_controller_workflows:
  - name: >-
      invoice-promote-{{ invoice_candidate_sha }}-{{ invoice_factory_material.lightwell.sha256 }}
    organization: demo
    inventory: demo-inventory
    ask_variables_on_launch: false
    allow_simultaneous: false
    simplified_workflow_nodes:
      - identifier: deploy
        unified_job_template: >-
          invoice-deploy-{{ invoice_candidate_sha }}-{{ invoice_factory_material.lightwell.sha256 }}
      - identifier: production-approval
        approval_node:
          name: Approve invoice production remediation
          description: "Deploy tested source {{ invoice_candidate_sha }} after human PR merge."
          timeout: 1800
        success_nodes:
          - deploy
